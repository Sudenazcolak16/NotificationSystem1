name: Java CI Pipeline

on:
  push:
    branches: [ "main", "phase-3" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Compile Project
      run: |
        # Tüm alt klasörlerdeki .java dosyalarını bulup bir listeye yazar
        find . -name "*.java" > sources.txt
        
        # Dosya listesini ekrana bas (Hata olursa nerede olduğunu görelim)
        echo "Derlenecek dosyalar:"
        cat sources.txt
        
        # Derleme komutu
        mkdir -p out
        javac -encoding UTF-8 -d out @sources.txt
